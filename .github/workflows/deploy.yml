name: Deploy Upixel to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      functions: ${{ steps.filter.outputs.functions }}
      functions_list: ${{ steps.list.outputs.list }}
      migrations: ${{ steps.filter.outputs.migrations }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'src/**'
              - 'public/**'
              - 'index.html'
              - 'vite.config.ts'
              - 'tailwind.config.ts'
              - 'tsconfig.json'
              - 'package.json'
              - 'package-lock.json'
            functions:
              - 'supabase/functions/**'
            migrations:
              - 'supabase/migrations/**'

      - name: Compute list of edge functions to deploy
        id: list
        if: steps.filter.outputs.functions == 'true'
        run: |
          BASE="${{ github.event.before }}"
          HEAD="${{ github.sha }}"
          if [ "$BASE" = "0000000000000000000000000000000000000000" ] || [ -z "$BASE" ]; then
            BASE="$HEAD~1"
          fi
          CHANGED=$(git diff --name-only "$BASE" "$HEAD" -- supabase/functions/ 2>/dev/null || true)
          # _shared/ afeta todas — se mudou, redeploya tudo
          if echo "$CHANGED" | grep -q '^supabase/functions/_shared/'; then
            FNS=$(ls supabase/functions/ | grep -v '^_' | tr '\n' ' ')
            echo "→ _shared mudou, redeployando todas"
          else
            FNS=$(echo "$CHANGED" | sed -nE 's|^supabase/functions/([^/]+)/.*|\1|p' | sort -u | grep -v '^_' | tr '\n' ' ')
          fi
          echo "list=$FNS" >> "$GITHUB_OUTPUT"
          echo "Functions to deploy: $FNS"

  # Aplica migrations ANTES de qualquer deploy de função/frontend.
  # Evita a inversão que derrubou o whatsapp-queue-processor (função nova
  # filtrando por coluna que ainda não existia no banco).
  # Requer os secrets SUPABASE_ACCESS_TOKEN e SUPABASE_DB_PASSWORD.
  deploy-migrations:
    needs: detect-changes
    if: needs.detect-changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Push database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref xusdhzwfkzufupjwbebt
          supabase db push --include-all

  deploy-functions:
    needs: [detect-changes, deploy-migrations]
    if: |
      always() &&
      needs.detect-changes.outputs.functions == 'true' &&
      needs.detect-changes.outputs.functions_list != '' &&
      (needs.deploy-migrations.result == 'success' || needs.deploy-migrations.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy changed edge functions (parallel)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          FNS="${{ needs.detect-changes.outputs.functions_list }}"
          PROJECT_REF="xusdhzwfkzufupjwbebt"
          echo "$FNS" | tr ' ' '\n' | grep -v '^$' | xargs -P 5 -I{} \
            supabase functions deploy {} --use-api --project-ref "$PROJECT_REF"

  build:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    outputs:
      bundle_built: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci --include=dev

      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_META_APP_ID: ${{ secrets.VITE_META_APP_ID }}
          VITE_META_FB_PAGE_CONFIG_ID: ${{ secrets.VITE_META_FB_PAGE_CONFIG_ID }}
          VITE_META_WHATSAPP_CONFIG_ID: ${{ secrets.VITE_META_WHATSAPP_CONFIG_ID }}
          VITE_ROOT_DOMAIN: ${{ secrets.VITE_ROOT_DOMAIN }}

      - name: Show bundle info
        run: |
          du -sh dist
          ls dist/assets/index-*.js 2>/dev/null | head -1

      - name: Package dist + deploy scripts
        run: tar -czf upixel-deploy.tar.gz dist/ deploy/

      - uses: actions/upload-artifact@v4
        with:
          name: upixel-deploy
          path: upixel-deploy.tar.gz
          retention-days: 7

  deploy-vps:
    needs: [detect-changes, build, deploy-functions, deploy-migrations]
    if: |
      always() &&
      needs.detect-changes.outputs.frontend == 'true' &&
      needs.build.result == 'success' &&
      (needs.deploy-functions.result == 'success' || needs.deploy-functions.result == 'skipped') &&
      (needs.deploy-migrations.result == 'success' || needs.deploy-migrations.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: upixel-deploy
          path: ./

      - name: Copy bundle to VPS via SSH pipe
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          echo "$VPS_SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          SSH="ssh -i /tmp/deploy_key \
            -p ${VPS_SSH_PORT:-22} \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=90 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=10 \
            -o BatchMode=yes"
          $SSH "$VPS_USERNAME@$VPS_HOST" "cat > /tmp/upixel-deploy.tar.gz" \
            < upixel-deploy.tar.gz
          $SSH "$VPS_USERNAME@$VPS_HOST" "du -sh /tmp/upixel-deploy.tar.gz"
          rm -f /tmp/deploy_key

      - name: Swap dist + reload nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          command_timeout: 3m
          script: |
            set -e
            rm -rf /tmp/upixel-extract
            mkdir -p /tmp/upixel-extract
            tar -xzf /tmp/upixel-deploy.tar.gz -C /tmp/upixel-extract
            bash /tmp/upixel-extract/deploy/deploy.sh /tmp/upixel-extract
            rm -rf /tmp/upixel-extract /tmp/upixel-deploy.tar.gz

  summary:
    needs: [detect-changes, deploy-migrations, deploy-functions, build, deploy-vps]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "## 🚀 Deploy summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| DB migrations | ${{ needs.deploy-migrations.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Edge functions | ${{ needs.deploy-functions.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend deploy | ${{ needs.deploy-vps.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Functions changed: \`${{ needs.detect-changes.outputs.functions_list || '(none)' }}\`" >> $GITHUB_STEP_SUMMARY
