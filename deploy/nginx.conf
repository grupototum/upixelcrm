events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Health check endpoint (default server)
    server {
        listen 80 default_server;
        server_name _;

        location /health {
            return 200 "Nginx Healthy";
            add_header Content-Type text/plain;
        }

        location / {
            return 200 "Nginx Healthy";
            add_header Content-Type text/plain;
        }
    }

    # ─────────────────────────────────────────────────────────────────
    # FRONTEND REMOVIDO (2026-07-19): upixel.app e *.upixel.app são servidos
    # pela VERCEL (domínios custom do projeto upixelcrm; tenant-provision-domain
    # provisiona subdomínios via Vercel API). O proxy /functions/v1/* que vivia
    # aqui foi movido para o vercel.json (rewrite → Supabase Cloud).
    # Este nginx segue responsável apenas por evolution.grupototum.com.
    # ─────────────────────────────────────────────────────────────────

    # evolution.grupototum.com — proxy para evolution-api container (porta interna 8080)
    server {
        listen 80;
        server_name evolution.grupototum.com;

        client_max_body_size 100M;

        resolver 127.0.0.11 ipv6=off valid=10s;
        set $evolution_upstream "evolution-api:8080";

        location / {
            proxy_pass         http://$evolution_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }
    }
}
