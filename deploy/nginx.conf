events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Health check endpoint (default server)
    server {
        listen 80 default_server;
        server_name _;

        location /health {
            return 200 "Nginx Healthy";
            add_header Content-Type text/plain;
        }

        location / {
            return 200 "Nginx Healthy";
            add_header Content-Type text/plain;
        }
    }

    # uPixel CRM — serve estático de /usr/share/nginx/html
    # (montado via volume: /var/www/upixelcrm/dist → /usr/share/nginx/html)
    # Deploy atualiza esse diretório via atomic swap; nginx serve imediatamente
    # sem restart — zero downtime garantido.
    server {
        listen 80;
        server_name upixel.app www.upixel.app *.upixel.app;

        root  /usr/share/nginx/html;
        index index.html;

        # ── Security headers (defense-in-depth) ─────────────────────────────
        # CSP é o principal — limita o que JS pode fazer mesmo em caso de XSS.
        # connect-src libera Supabase (REST + Edge Functions + Realtime),
        # Meta Graph API, Google APIs (workspace/ads), e o próprio domínio.
        # script-src: 'self' + Meta SDK + Google client + unsafe-inline para
        # Vite (necessário; o build inline-injeta init de runtime). Estudar
        # migração futura pra nonce-based.
        # frame-ancestors 'self': impede iframe externo.
        # frame-src: libera apenas Facebook (Embedded Signup roda em popup
        # ou iframe Meta), demais sources negadas.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://connect.facebook.net https://apis.google.com https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https: https://*.fbcdn.net https://platform-lookaside.fbsbx.com; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' https://xusdhzwfkzufupjwbebt.supabase.co wss://xusdhzwfkzufupjwbebt.supabase.co https://graph.facebook.com https://*.googleapis.com https://accounts.google.com; frame-src 'self' https://www.facebook.com https://accounts.google.com; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self';" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(self), interest-cohort=()" always;
        # HSTS — força HTTPS por 1 ano. Inclui subdomains (*.upixel.app).
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # Proxy reverso pra Supabase Edge Functions.
        # Permite usar upixel.app/functions/v1/* (URL "bonita" no domínio próprio)
        # em vez de expor xusdhzwfkzufupjwbebt.supabase.co. Necessário pra:
        # - Meta Data Deletion Callback (registrado como upixel.app/functions/v1/...)
        # - Webhooks Meta/Instagram/WhatsApp Cloud quando o admin preferir essa URL
        location /functions/v1/ {
            resolver 1.1.1.1 8.8.8.8 valid=300s;
            set $supabase_functions "https://xusdhzwfkzufupjwbebt.supabase.co";

            proxy_pass         $supabase_functions$request_uri;
            proxy_http_version 1.1;
            proxy_ssl_server_name on;
            proxy_set_header   Host              xusdhzwfkzufupjwbebt.supabase.co;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Host  $host;
            # Repassa Authorization e demais headers padrão (proxy_pass_request_headers on é default)
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;

            # CORS — Supabase já manda os headers; não duplicamos aqui
        }

        # React SPA: todas as rotas servem index.html
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # Assets com hash no nome: cache imutável (1 ano)
        location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # index.html nunca cacheado (garante bundle hash atualizado)
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            try_files $uri =404;
        }
    }

    # evolution.grupototum.com — proxy para evolution-api container (porta interna 8080)
    server {
        listen 80;
        server_name evolution.grupototum.com;

        client_max_body_size 100M;

        resolver 127.0.0.11 ipv6=off valid=10s;
        set $evolution_upstream "evolution-api:8080";

        location / {
            proxy_pass         http://$evolution_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }
    }
}
