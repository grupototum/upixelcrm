# ════════════════════════════════════════════════════════════════════════
# postgresql.conf — uPixel CRM self-hosted
#
# Baseado no default do supabase/postgres, com pg_cron e pg_net habilitados
# via shared_preload_libraries (obrigatório para o cron `automation-worker`,
# ver supabase/migrations/20260428_automation_worker_cron.sql e
# 20260618_automation_worker_cron_fix.sql).
#
# [AGENTE] preparou este arquivo; [OPERADOR] pode ajustar shared_buffers /
# max_connections / work_mem de acordo com o tamanho real da VPS antes de
# subir em produção (valores abaixo são um ponto de partida conservador).
# ════════════════════════════════════════════════════════════════════════

listen_addresses = '*'
port = 5432
max_connections = 100

# pg_cron precisa estar em shared_preload_libraries e apontar para o banco
# onde os jobs serão criados. pg_net também precisa estar pré-carregado.
shared_preload_libraries = 'pg_cron,pg_net,pgsodium'
cron.database_name = 'postgres'

# Memória — ajustar [OPERADOR] conforme RAM real da VPS (regra geral:
# shared_buffers ~25% da RAM, effective_cache_size ~50-75%).
shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 8MB
maintenance_work_mem = 64MB

# WAL / checkpoints — defaults razoáveis para uma VPS pequena/média.
wal_level = logical
max_wal_size = 1GB
min_wal_size = 80MB

# Logging básico (sem stack de observabilidade — ver README.md).
log_min_duration_statement = 1000
log_line_prefix = '%m [%p] %q%u@%d '
